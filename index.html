        const EMPTY_SELECTIONS = { hero: [], legend: [] };

        const hasModeData = (data) => data && !Array.isArray(data) && data.modes;

        const getDefaultSelectionsFromData = (data = []) => {
            return data.reduce((acc, skill) => {
                if (skill.upgraded) {
                    if (skill.rank === '英雄') {
                        acc.hero.push(skill.name);
                    } else if (skill.rank === '傳說') {
                        acc.legend.push(skill.name);

            const data = transferData[classId];
            if (!hasModeData(data)) return null;
            return data.defaultMode || Object.keys(data.modes)[0];

        const getTransferRows = (classId, modeId = null) => {
            const data = transferData[classId];
            if (!data) return [];
            if (!hasModeData(data)) return data;

            const activeMode = modeId || getDefaultClassMode(classId);
            return data.modes[activeMode] || [];

        const getSalesGroups = (classId, modeId = null) => {
            const skills = salesData[classId];
            if (!skills) return { hero: [], legend1: [], legend2: [] };
            if (!skills.hero) {
                const activeMode = modeId || getDefaultClassMode(classId);
                return skills[activeMode] || { hero: [], legend1: [], legend2: [] };
            }
            return skills;
        };

        const matchesAttackMode = (skill, modeId) => {
            if (!modeId || !skill.attackType || skill.attackType === '通用') return true;
            return modeId === 'ranged' ? skill.attackType === '遠攻' : skill.attackType === '近戰';
        };

        const getModeAwareDefaultSelections = (data = [], modeId = null) => {
            return getDefaultSelectionsFromData(data.filter(skill => matchesAttackMode(skill, modeId)));
        };

        const getOrientationSelections = (data, type, modeId = null) => {
            const getVal = (skill) => skill[type === 'pvp' ? 'pvp' : 'pve'];
            const getPriority = (val) => {
                if (!val) return 999;
                if (val === 'V') return 0;
                const match = val.match(/\d+/);
                // 如果有括號數字如 (2)，也視為 2
                return match ? parseInt(match[0], 10) : 999;
            };

            const heroSkills = data.filter(d => d.rank === '英雄')
                .map(s => ({ ...s, p: getPriority(getVal(s)) }))
                .filter(s => s.p < 999)
                .sort((a, b) => a.p - b.p)
                .slice(0, 6)
                .map(s => s.name);

            const legendSkills = data.filter(d => d.rank === '傳說')
                .map(s => ({ ...s, p: getPriority(getVal(s)) }))
                .filter(s => s.p < 999)
                .sort((a, b) => a.p - b.p)
                .slice(0, 5)
                .map(s => s.name);

            return { hero: heroSkills, legend: legendSkills };

        // --- 主應用程式 ---

        const SkillInfoApp = () => {
            const [activeTab, setActiveTab] = useState('home');

            // 根據 upgraded 屬性計算初始選擇狀態
            const getInitialSelections = () => {
                const initial = {};

                // 遍歷 transferData 找出所有 upgraded 為 true 的技能
                Object.keys(transferData).forEach(classId => {
                    const data = transferData[classId];
                    if (hasModeData(data)) {
                        initial[classId] = {};
                        Object.keys(data.modes).forEach(modeId => {
                            initial[classId][modeId] = getModeAwareDefaultSelections(data.modes[modeId], modeId);

                    } else {
                        initial[classId] = getDefaultSelectionsFromData(data);
                    }
                });

                return initial;
            };

            const getInitialModes = () => {
                return classesConfig.reduce((acc, config) => {
                    if (config.modes) {
                        acc[config.id] = getDefaultClassMode(config.id);

                    return acc;

            const [activeSkillInfo, setActiveSkillInfo] = useState(null);

            const [showRotateHint, setShowRotateHint] = useState(true);

                try {
                    const savedPreference = window.localStorage.getItem('youtubeSubscribeExpanded');
                    if (savedPreference !== null) return savedPreference === 'true';
                } catch (error) {
                    // Continue with the viewport default when storage is unavailable.
                }

                return window.matchMedia('(min-width: 768px)').matches;
            });

            const getActiveMode = (classId) => classModes[classId] || getDefaultClassMode(classId);

            const getCurrentSelections = (classId) => {
                const modeId = getActiveMode(classId);
                const classSelection = selections[classId];
                if (modeId) {
                    return classSelection && classSelection[modeId] ? classSelection[modeId] : EMPTY_SELECTIONS;
                }
                return classSelection || EMPTY_SELECTIONS;
            };

            const setClassSelections = (classId, nextSelections, modeOverride = null) => {
                const modeId = modeOverride || getActiveMode(classId);
                setSelections(prev => {
                    if (modeId) {
                        return {
                            ...prev,
                            [classId]: {
                                ...(prev[classId] || {}),
                                [modeId]: nextSelections
                            }
                        };
                    }

                    return {
                        ...prev,
                        [classId]: nextSelections
                    };
                });
            };

            const getPreferredElements = (classId) => preferredElements[classId] || [];

            const handleTogglePreferredElement = (classId, element) => {
                setPreferredElements(prev => {
                    const current = prev[classId] || [];
                    const isSelected = current.includes(element);
                    const nextElements = isSelected
                        ? current.filter(item => item !== element)
                        : current.length >= 2
                            ? current
                            : [...current, element];

                    if (!isSelected && current.length >= 2) {
                        alert('偏好屬性最多只能選擇 2 個！');
                    }

                    return {
                        ...prev,
                        [classId]: nextElements
                    };
                });
            };

            // 記錄各職業當前選擇的取向 (pvp/pve/null)
            const [orientations, setOrientations] = useState(() => {
                return classesConfig.reduce((acc, config) => {

            useEffect(() => {
                setHoveredSkillInfo(null);

            useEffect(() => {

            const renderSkillDescriptionLines = (description) => {
                return description.split('\n').filter(Boolean).map((line, index) => (

            const handleSkillNameEnter = (event, row, description) => {
                if (!description || typeof window === 'undefined') return;
                if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

                const rect = event.currentTarget.getBoundingClientRect();
                const estimatedHeight = 260;
                const top = rect.bottom + 10 > window.innerHeight - estimatedHeight
                    ? Math.max(16, rect.top - estimatedHeight - 10)
                    : rect.bottom + 10;
                const left = Math.max(16, Math.min(rect.left, window.innerWidth - 400));

                setHoveredSkillInfo({
                    ...buildSkillInfo(row, description),
                    top,
                    left
                });
            };

            const handleSkillNameClick = (event, row, description) => {
                if (!description || typeof window === 'undefined') return;
                const shouldUseSheet = window.matchMedia('(hover: none)').matches || window.matchMedia('(max-width: 767px)').matches;

                event.stopPropagation();
                setHoveredSkillInfo(null);
                setActiveSkillInfo(buildSkillInfo(row, description));

            const handleChangeClassMode = (classId, modeId) => {
                setClassModes(prev => ({ ...prev, [classId]: modeId }));

                const activeOrientation = orientations[classId];
                const data = getTransferRows(classId, modeId);
                if (activeOrientation) {
                    setClassSelections(classId, getOrientationSelections(data, activeOrientation, modeId), modeId);
                } else {
                    setClassSelections(classId, getModeAwareDefaultSelections(data, modeId), modeId);
                }

            const renderModeSwitch = (classConfig, compact = false) => {
                if (!classConfig.modes) return null;

                const activeMode = getActiveMode(classConfig.id);

                            const isActive = activeMode === mode.id;
                            return (
                                <button
                                    key={mode.id}

                                </button>
                            );

                    </div>
                );
            };

            // 處理技能勾選邏輯
            const handleToggleSkill = (classId, skillName, rank) => {
                let rankKey = null;
                if (rank === '英雄') rankKey = 'hero';
                else if (rank === '傳說') rankKey = 'legend';
                else return;

                const data = getTransferRows(classId, getActiveMode(classId));
                const currentClassSelections = getCurrentSelections(classId);
                const currentList = currentClassSelections[rankKey];

                const isSelected = currentList.includes(skillName);

                if (isSelected) {
                    setClassSelections(classId, {
                        ...currentClassSelections,
                        [rankKey]: currentList.filter(s => s !== skillName)
                    });
                } else {
                    if (rankKey === 'hero') {
                        if (currentList.length >= 6) {
                            alert(`英雄技能最多只能選擇 6 個！`);
                            return;
                        }
                    } else {
                        // 處理傳說技能細分上限
                        const skillData = data.find(s => s.name === skillName);
                        const isMall = skillData.pvp.includes('商城紫') || skillData.pve.includes('商城紫');
                        const isClan = skillData.pvp.includes('血盟紫') || skillData.pve.includes('血盟紫');

                        const counts = currentList.reduce((acc, name) => {
                            const s = data.find(item => item.name === name);
                            if (!s) return acc;
                            if (s.pvp.includes('商城紫') || s.pve.includes('商城紫')) acc.mall++;
                            else if (s.pvp.includes('血盟紫') || s.pve.includes('血盟紫')) acc.clan++;
                            else acc.reg++;
                            return acc;
                        }, { reg: 0, mall: 0, clan: 0 });

                        if (isMall) {
                            if (counts.mall >= 1) { alert('商城紫技能最多只能選擇 1 個！'); return; }
                        } else if (isClan) {
                            if (counts.clan >= 1) { alert('血盟紫技能最多只能選擇 1 個！'); return; }

                        ...currentClassSelections,
                        [rankKey]: [...currentList, skillName]
                    });

                const activeMode = getActiveMode(classId);
                const data = getTransferRows(classId, activeMode);
                if (newOrientation) {

                    setClassSelections(classId, getModeAwareDefaultSelections(data, activeMode));

            const handleResetSelections = (classId) => {

                        },

            const parseMethodToCoins = (method) => {

                if (method.includes('商城紫')) return 0;
                if (method.includes('180W')) return 1800000;
                if (method.includes('300W')) return 3000000;
                // Remove commas and parse as integer
                const cleanStr = method.replace(/,/g, '');
                const num = parseInt(cleanStr, 10);
                return isNaN(num) ? 0 : num;

            const formatNumber = (num) => {
                return num.toLocaleString();
            };

            const getSelectedElements = (skills, selectedSkillNames) => {
                const elementOrder = ['水', '火', '風', '地'];
                const selectedElements = skills
                    .filter(skill => selectedSkillNames.includes(skill.name))
                    .map(skill => skill.element)
                    .filter(element => elementOrder.includes(element));

                return elementOrder.filter(element => selectedElements.includes(element));
            };

            const mergeElements = (...elementLists) => {
                const elementOrder = ['水', '火', '風', '地'];
                const selectedElements = elementLists.flat();
                return elementOrder.filter(element => selectedElements.includes(element));

                const activeMode = getActiveMode(classId);

                const legendCount = currentSelections.legend.length;

                const heroSkills = data.filter(d => d.rank === '英雄');
                const allLegendSkills = data.filter(d => d.rank === '傳說');
                const uniqueLegendSkillNames = classId === 'elf'
                    ? ['精靈之翼靴', '不死鳥']
